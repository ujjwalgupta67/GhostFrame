# Shared settings for all four GhostFrame Besu validator nodes.
# Each node also gets its own key, data folder and IP from docker-compose.yml.

genesis-file="/config/genesis.json"
sync-mode="FULL"

# Free-gas private network (genesis has zeroBaseFee) so nobody needs ETH.
min-gas-price=0

# JSON-RPC (Docker only exposes it on 127.0.0.1 of the laptop).
rpc-http-enabled=true
rpc-http-host="0.0.0.0"
rpc-http-port=8545
rpc-http-api=["ETH","NET","WEB3","QBFT","ADMIN","TXPOOL"]
rpc-http-cors-origins=["*"]
host-allowlist=["*"]

# Peer-to-peer between the nodes.
p2p-port=30303

# Shows why a contract call reverted (handy while debugging).
revert-reason-enabled=true

logging="INFO"
